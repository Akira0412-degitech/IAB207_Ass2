{% extends "base.html" %}
{% from "bootstrap5/form.html" import render_form %}

{% block content %}
<main class="container py-4">

  <h1 style="font-size:clamp(2rem,6vw,3rem);">{{ heading }}</h1>

  <div class="col-md-6">
    {{ render_form(form) }}
  </div>

  {% if heading == 'Login' %}
  <div class="col-md-6 mt-3">
    <!-- TODO(#2 Register): once the auth.register route exists, turn this
         into a real link with url_for('auth.register'). Left as plain text
         for now so this page doesn't crash with a BuildError before that
         route is implemented. -->
    <p>New user? Registration is coming soon.</p>
  </div>
  {% endif %}

</main>
{% endblock %}
